<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Фаззинг разбора пакета и анализа</title>
</head>
<body>
<!-- Загружаются только два модуля без DOM: разбор протокола и анализ. -->
<script src="../js/telemetry.js"></script>
<script src="../js/analysis.js"></script>
<script>
'use strict';

const T = window.CU.Telemetry;
const A = window.CU.Analysis;

/* ── Детерминированный генератор ─────────────────────────────────────── */
function rng(seed) {
  let s = seed >>> 0;
  return function () {
    s |= 0; s = (s + 0x6D2B79F5) | 0;
    let t = Math.imul(s ^ (s >>> 15), 1 | s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

const FIELDS = T.FIELDS;

function makeToken(rand, def) {
  const roll = rand();
  if (roll < 0.04) return 'OFF';
  if (roll < 0.08) return '';
  if (roll < 0.10) return 'NaN';
  if (roll < 0.12) return '1e3';
  if (roll < 0.14) return '0x10';
  if (roll < 0.16) return '  ' + (rand() * 100 | 0) + '  ';
  if (roll < 0.18) return '−42';                 // типографский минус
  if (roll < 0.20) return '+' + (rand() * 100 | 0);
  if (roll < 0.22) return (rand() * 1e18 | 0).toString();
  if (roll < 0.24) return '-' + (rand() * 1e18 | 0);
  if (roll < 0.26) return 'ыы';
  if (roll < 0.28) return '9'.repeat(40);
  if (roll < 0.32 && def) {
    const span = def.range[1] - def.range[0];
    return String(Math.round(def.range[0] + rand() * span));
  }
  return String(Math.round(rand() * 40000) - 20000);
}

/* Профиль трафика: бо��ьшая доля правдоподобных пакетов нужна, чтобы
   анализ и оценка модулей действительно прогонялись, а не только отказ. */
const PROFILE = { garbage: 0.04, truncated: 0.04, defect: 0.18 };

function makeValidPacket(rand, cfg, mk) {
  const parts = [cfg.pre, String(mk)];
  for (let i = 1; i < FIELDS.length; i++) {
    const def = FIELDS[i];
    /* правдоподобные значения около рабочего диапазона */
    if (def.key === 'akb') parts.push(String(7200 + Math.round(rand() * 1400)));
    else if (def.key === 'wheel') parts.push(String(Math.round(rand() * 20000) - 10000));
    else if (def.key[0] === 's') parts.push(String(Math.round(rand() * 60000)));
    else parts.push(String(Math.round(rand() * 30000) - 15000));
  }
  parts.push(cfg.post);
  return parts.join(';');
}

function makePacket(rand, cfg, mk) {
  const mode = rand();
  const pre = rand() < 0.97 ? cfg.pre : 'ZZZZ';
  const post = rand() < 0.97 ? cfg.post : 'XXXX';
  const parts = [pre];

  if (mode < PROFILE.garbage + PROFILE.truncated + PROFILE.defect) {
    /* основная часть потока — обычные пакеты с изредка испорченным полем */
    const broken = rand() < PROFILE.defect;
    for (let i = 0; i < FIELDS.length; i++) {
      if (i === 0) { parts.push(String(mk)); continue; }
      parts.push(broken && rand() < 0.15 ? makeToken(rand, FIELDS[i]) : makeToken(rand, FIELDS[i]));
    }
    parts.push(post);
    if (rand() < PROFILE.truncated * 12) parts.length = 1 + (rand() * 12 | 0);
    return parts.join(';');
  }

  if (mode < PROFILE.garbage + PROFILE.truncated + 0.02) {
    /* короткий пакет */
    for (let i = 0; i < 1 + (rand() * 8 | 0); i++) parts.push(String(rand() * 1000 | 0));
  } else if (mode < PROFILE.garbage + PROFILE.truncated + 0.04) {
    /* короткий ИЛИ длинный пакет: лишние поля сверх протокола —
       это сторонние датчики по I2C, они не должны ломать разбор,
       а недостающие поля — должны                                   */
    if (rand() < 0.5) {
      for (let i = 0; i < 1 + (rand() * 8 | 0); i++) parts.push(String(rand() * 1000 | 0));
    } else {
      const extra = 1 + (rand() * 6 | 0);
      for (let i = 0; i < FIELDS.length + extra; i++) parts.push(String(rand() * 1000 | 0));
    }
  } else {
    for (let i = 0; i < FIELDS.length; i++) {
      const def = i === 0 ? FIELDS[0] : FIELDS[i];
      parts.push(i === 0 && rand() < 0.85 ? String(mk) : makeToken(rand, def));
    }
  }
  parts.push(post);
  return parts.join(';');
}

const CFG = {
  pre: 'AA55', post: '0D0A', chaosLimit: 3,
  vwLo: 7.2, vwHi: 8.5, vcLo: 6.6, vcHi: 8.7,
};

/* ── Проверки ─────────────────────────────────────────────────────────── */
const failures = [];
function fail(kind, detail) {
  if (failures.length < 40) failures.push(kind + ' :: ' + detail);
}

function checkFrame(frame, raw) {
  if (!frame || typeof frame !== 'object') return fail('ТИП', 'parse вернул не объект');
  if (frame.fields.length !== FIELDS.length) {
    return fail('ПОЛЯ', 'в результате ' + frame.fields.length + ' полей вместо ' + FIELDS.length);
  }
  if (![0, 1, 2].includes(frame.level)) return fail('УРОВЕНЬ', 'level=' + frame.fields && frame.level);

  for (let i = 0; i < frame.fields.length; i++) {
    const slot = frame.fields[i];
    if (!['ok', 'off', 'bad', 'sat'].includes(slot.state)) {
      fail('СОСТОЯНИЕ ПОЛЯ', i + ' -> state=' + slot.state);
    }
    if (slot.value !== null && !isFinite(slot.value)) {
      fail('ЗНАЧЕНИЕ', i + ' -> ' + slot.value + ' (токен «' + slot.token + '»)');
    }
  }

  if (frame.level === 2) {
    if (typeof frame.reason !== 'string' || !frame.reason) fail('ПРИЧИНА', 'уровень 2 без текста: ' + raw.slice(0, 70));
    if (typeof frame.reasonKey !== 'string' || !frame.reasonKey) fail('КЛЮЧ ПРИЧИНЫ', 'уровень 2 без reasonKey');
    /* у отклонённого пакета время может сохраниться (хаос-отказ смотрит
       на счётчик МК уже разобранным) — но оно обязано быть числом */
    if (frame.mk !== null && !isFinite(frame.mk)) fail('MK', 'уровень 2, mk = ' + frame.mk);
  } else if (!isFinite(frame.mk)) {
    fail('MK', 'уровень < 2, но mk = ' + frame.mk);
  }

  if (frame.raw !== raw) fail('СЫРОЙ ТЕКСТ', 'parse исказил исходную строку');

  /* 3. Допуски на длину пакета: меньше протокола — отказ,
        больше — принимаем, стандартные поля читаются.
        Проверяем на эталонных пакетах отдельно от шума.            */
  const body = raw.trim().split(';');
  const expectedExtra = body.length - (FIELDS.length + 2);
  if (expectedExtra >= 0 && frame.level < 2) {
    if (frame.extraFields !== expectedExtra) {
      fail('ЛИШНИЕ ПОЛЯ', 'ожидалось ' + expectedExtra + ', получено ' + frame.extraFields + ' :: ' + raw.slice(0, 60));
    }
    if (expectedExtra === 0 && frame.extraFields !== 0) {
      fail('ЛИШНИЕ ПОЛЯ', 'эталонный пакет помечен как расширенный');
    }
  }
  if (expectedExtra < 0 && frame.level !== 2) {
    fail('КОРОТКИЙ ПАКЕТ', 'принят пакет из ' + body.length + ' полей: ' + raw.slice(0, 60));
  }
}

/* ── Основной прогон ──────────────────────────────────────────────────── */
function runFuzz(iterations, seed) {
  const rand = rng(seed);
  const stream = new A.Stream();
  const ctx = { cfg: CFG, stale: false, rebooted: false };
  let mk = 0;

  for (let n = 0; n < iterations; n++) {
    mk += 1 + (rand() < 0.1 ? (rand() * 4 | 0) : 0);   /* изредка пропавший пакет */
    const raw = rand() < 0.55
      ? makeValidPacket(rand, CFG, mk)
      : makePacket(rand, CFG, mk);
    let frame, derived, res;
    try {
      frame = T.parse(raw, CFG);
      checkFrame(frame, raw);

      /* детерминизм: тот же вход — тот же выход */
      const again = T.parse(raw, CFG);
      if (JSON.stringify(again) !== JSON.stringify(frame)) {
        fail('НЕДЕТЕРМИНИЗМ', raw.slice(0, 70));
      }

      derived = T.derive(frame);
      if (derived !== frame) fail('DERIVE', 'derive вернул другой объект');

      res = stream.record(frame, Date.now());
      if (typeof res.accepted !== 'boolean') fail('RECORD', 'нет признака accepted');
    } catch (error) {
      fail('ИСКЛЮЧЕНИЕ', error.message + ' | пакет: ' + raw.slice(0, 90));
      continue;
    }

    /* инварианты накопителя */
    if (stream.frames.length > 20000) fail('ПАМЯТЬ', 'frames=' + stream.frames.length);
    if (stream.log.length > 5000) fail('ПАМЯТЬ', 'log=' + stream.log.length);
    if (stream.matrix.length > 64) fail('ПАМЯТЬ', 'matrix=' + stream.matrix.length);
    if (stream.arrivals.length > 600) fail('ПАМЯТЬ', 'arrivals=' + stream.arrivals.length);
    if (stream.steps.length > 200) fail('ПАМЯТЬ', 'steps=' + stream.steps.length);

    if (res.accepted) {
      mk = frame.mk;
      let mods;
      try {
        mods = A.modules(frame, ctx);
        if (mods.length !== 5) fail('МОДУЛИ', 'вернулось ' + mods.length);
        for (const m of mods) if (![0, 1, 2].includes(m.level)) fail('МОДУЛЬ УРОВЕНЬ', m.id + '=' + m.level);
        A.attitude(frame);
      } catch (error) {
        fail('ИСКЛЮЧЕНИЕ МОДУЛЕЙ', error.message);
      }
      void mods;
    }

    /* устаревание — отдельный режим */
    if (n % 97 === 0) {
      try {
        const staleCtx = { cfg: CFG, stale: true, rebooted: n % 194 === 0 };
        const mods = A.modules(frame, staleCtx);
        for (const m of mods) if (m.level !== 2) fail('УСТАРЕВАНИЕ', m.id + ' не помечен аварией');
      } catch (error) {
        fail('ИСКЛЮЧЕНИЕ УСТАРЕВАНИЯ', error.message);
      }
    }
  }

  /* отчёт должен быть читаемым текстом: без undefined и NaN */
  let report = '';
  try {
    report = A.report(stream, {
      now: Date.now(), source: 'fuzz', latency: 12.3, pollErrors: 2,
      modules: A.modules(null, { cfg: CFG, stale: true, rebooted: false }),
      frame: null, events: [{ t: '10:00:00', l: 0, msg: 'старт' }], cfg: CFG,
    });
  } catch (error) {
    fail('ИСКЛЮЧЕНИЕ ОТЧЁТА', error.message);
  }
  /* Отчёт цитирует испорченные значения пакетов, поэтому «NaN» внутри
     кавычек «…» — это честная цитата мусора из пакета, а не дефект
     форматирования. Проверяем текст вне кавычек.                      */
  const scannable = report.replace(/«[^»]*»/g, '""');
  for (const bad of ['undefined', 'NaN', '[object Object]', 'Infinity']) {
    if (scannable.includes(bad)) {
      const line = scannable.split('\n').find(l => l.includes(bad));
      fail('ОТЧЁТ', 'содержит «' + bad + '»: ' + (line || '').trim().slice(0, 80));
    }
  }

  const summary = stream.summary();
  const nums = ['uptime', 'accepted', 'rejected', 'defective', 'lost', 'duplicates', 'rate', 'errorRate'];
  for (const key of nums) {
    if (!isFinite(summary[key])) fail('СВОДКА', key + ' = ' + summary[key]);
  }
  if (summary.completeness !== null && (summary.completeness < 0 || summary.completeness > 100)) {
    fail('СВОДКА', 'completeness = ' + summary.completeness);
  }

  /* ── Проверки на длинных прогонах ───────────────────────────────────────
     framesSince() ищет границу делением пополам, а поток при длинном
     прогоне упирается в ограничения длины. Обе вещи ломаются тихо:
     графика просто показывает не то, а счётчики перестают расти.       */

  function checkScale() {
    const frames = stream.frames;

    /* 1. Деление пополам обязано совпадать с перебором */
    const now = Date.now();
    for (const back of [0, 1000, 5000, 60000, 300000, 3600000]) {
      const moment = now - back;
      const expectedCount = frames.filter(f => f.at >= moment).length;
      const actualCount = stream.framesSince(moment).length;
      if (expectedCount !== actualCount) {
        fail('framesSince', 'окно ' + back + ' мс: перебор даёт ' + expectedCount + ', поиск ' + actualCount);
        break;
      }
    }

    /* 2. Возвращённый срез обязан быть непрерывным по времени:
         сортировка кадров не нарушена, окно не «перескакивает».          */
    const slice = stream.framesSince(now - 300000);
    for (let i = 1; i < slice.length; i++) {
      if (slice[i].at < slice[i - 1].at) {
        fail('ПОРЯДОК КАДРОВ', 'кадры в окне идут не по времени');
        break;
      }
    }

    /* 3. Полнота потока обязана лежать в пределах 0…100 % */
    for (const windowSize of [undefined, 10, 120, 200]) {
      const value = stream.completeness(windowSize);
      if (value !== null && (!isFinite(value) || value < -0.001 || value > 100.001)) {
        fail('ПОЛНОТА', 'окно ' + windowSize + ' → ' + value);
      }
    }

    /* 4. При обрезке журнала счётчики причин продолжают расти:
         список причин живёт в отдельной карте, а не в том же массиве.  */
    const defects = stream.defectList();
    let defectSum = 0;
    for (const item of defects) defectSum += item.count;
    if (defects.some(item => !isFinite(item.count) || item.count <= 0)) {
      fail('ПРИЧИНЫ', 'счётчик причина неположителен');
    }
    /* каждая причина в списке должна встречаться и в самом журнале */
    if (stream.log.length >= 5000 && defectSum < stream.rejected) {
      fail('ПРИЧИНЫ', 'сумма причин ' + defectSum + ' меньше отклонённых ' + stream.rejected);
    }

    /* 5. Принятые пакеты в frames совпадают со счётчиком accepted
       с точностью до ограничения длины истории.                       */
    const acceptedInLog = stream.log.filter(e => e.level !== 2).length;
    if (acceptedInLog > stream.accepted) {
      fail('ЖУРНАЛ', 'принятых в журнале ' + acceptedInLog + ' больше, чем счётчик ' + stream.accepted);
    }
    if (stream.frames.length + 20000 <= stream.accepted && frames.length !== 20000) {
      fail('ИСТОРИЯ', 'кадров ' + frames.length + ' при принятых ' + stream.accepted);
    }

    /* 6. Матрица целостности: столько же колонок, сколько кадров в окне */
    if (stream.matrix.length && stream.matrix.some(col => col.length !== FIELDS.length)) {
      fail('МАТРИЦА', 'колонка не из ' + FIELDS.length + ' полей');
    }
  }

  void mk;
  checkScale();
  return JSON.stringify({
    iterations,
    seed,
    scale: {
      frames: stream.frames.length,
      log: stream.log.length,
      matrix: stream.matrix.length,
      arrivals: stream.arrivals.length,
      steps: stream.steps.length,
      heapMB: performance.memory ? +(performance.memory.usedJSHeapSize / 1048576).toFixed(1) : null,
      capsHit: {
        frames: stream.frames.length >= 20000,
        log: stream.log.length >= 5000,
      },
    },
    failures: failures.slice(0, 40),
    failureCount: failures.length,
    accepted: summary.accepted,
    rejected: summary.rejected,
    logSize: stream.log.length,
    reportLines: report.split('\n').length,
  });
}

window.runFuzz = runFuzz;
</script>
</body>
</html>
